<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" width="100%"><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1877f2"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0c6f71"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#61636d"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#cfd0d7"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f7d043"/></marker></defs><rect x="225.0" y="30" width="210" height="52" rx="8" fill="#f4f5f7" stroke="#0c6f71" stroke-width="2"/><text x="330.0" y="52" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#16181f" text-anchor="middle">PSUM — 2 MiB per core</text><text x="330.0" y="69" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="middle">matmul accumulation</text><rect x="180.0" y="98" width="300" height="52" rx="8" fill="#f4f5f7" stroke="#1877f2" stroke-width="2"/><text x="330.0" y="120" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#16181f" text-anchor="middle">SBUF — 28 MiB per core</text><text x="330.0" y="137" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="middle">on-chip scratchpad</text><rect x="105.0" y="166" width="450" height="52" rx="8" fill="#f4f5f7" stroke="#61636d" stroke-width="2"/><text x="330.0" y="188" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#16181f" text-anchor="middle">HBM — 96 GiB per chip</text><text x="330.0" y="205" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="middle">device memory at up to 2.9 TB/s</text><rect x="30.0" y="234" width="600" height="52" rx="8" fill="#f4f5f7" stroke="#61636d" stroke-width="2"/><text x="330.0" y="256" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#16181f" text-anchor="middle">Host DRAM — size varies by instance</text><text x="330.0" y="273" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="middle">memory attached to the host CPU</text><path d="M 655 300 L 655 46" fill="none" stroke="#1877f2" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="648" y="56" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1877f2" text-anchor="end">faster</text><text x="648" y="296" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#61636d" text-anchor="end">bigger</text><text x="345" y="322" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#16181f" text-anchor="middle">Trainium2 example. SBUF and PSUM are software-managed.</text></svg>