<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 314" role="img" width="100%"><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4d97ff"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3aa8aa"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#969cab"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#393f4f"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f7d043"/></marker></defs><text x="20" y="27" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em" fill="#969cab" text-anchor="start">PREFILL AND DECODE</text><rect x="20" y="45" width="232" height="126" rx="8" fill="#161922" stroke="#4d97ff" stroke-width="2"/><text x="34" y="72" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#4d97ff" text-anchor="start">Prefill</text><text x="34" y="97" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#e9ebf1" text-anchor="start">Process prompt tokens</text><text x="34" y="121" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#e9ebf1" text-anchor="start">Reuse weights across tokens</text><text x="34" y="145" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#e9ebf1" text-anchor="start">Often compute-bound</text><rect x="268" y="45" width="232" height="126" rx="8" fill="#161922" stroke="#3aa8aa" stroke-width="2"/><text x="282" y="72" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3aa8aa" text-anchor="start">Decode</text><text x="282" y="97" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#e9ebf1" text-anchor="start">One token per sequence</text><text x="282" y="121" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#e9ebf1" text-anchor="start">Reuse weights across a batch</text><text x="282" y="145" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#e9ebf1" text-anchor="start">Often memory-bound</text><rect x="20" y="189" width="480" height="110" rx="8" fill="#16223a" stroke="#393f4f" stroke-width="1.5"/><text x="36" y="216" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#e9ebf1" text-anchor="start">Batch-1 decode · 8B BF16 on one Trainium2</text><text x="36" y="240" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e9ebf1" text-anchor="start">16 GB of weights at 2.9 TB/s → about 180 tokens/s</text><text x="36" y="263" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#969cab" text-anchor="start">Weight-only ceiling at full HBM bandwidth</text><text x="36" y="283" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#969cab" text-anchor="start">Excludes KV traffic, compute and communication</text></svg>