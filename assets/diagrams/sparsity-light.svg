ed cells show nonzero values at the pattern limit.</text><text x="350" y="195" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="500" fill="#61636d" text-anchor="middle">The regular pattern lets the Tensor Engine skip multiplications by zero.</text><text x="350" y="222" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#1877f2" text-anchor="middle">Peak gains depend on input format and NeuronCore generation.</text></svg>