 UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">23</text><text x="608.0" y="63" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="start">full precision</text><text x="108" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#16181f" text-anchor="end">TF32</text><rect x="118" y="78" width="15.0" height="22" rx="2" fill="#61636d" stroke="#61636d" stroke-width="1.5"/><rect x="133.0" y="78" width="120.0" height="22" rx="2" fill="#1877f2" stroke="#1877f2" stroke-width="1.5"/><text x="193.0" y="93" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><rect x="253.0" y="78" width="150.0" height="22" rx="2" fill="#0c6f71" stroke="#0c6f71" stroke-width="1.5"/><text x="328.0" y="93" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">10</text><text x="413.0" y="93" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="start">FP32 range, less precision</text><text x="108" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#16181f" text-anchor="end">BF16</text><rect x="118" y="108" width="15.0" height="22" rx="2" fill="#61636d" stroke="#61636d" stroke-width="1.5"/><rect x="133.0" y="108" width="120.0" height="22" rx="2" fill="#1877f2" stroke="#1877f2" stroke-width="1.5"/><text x="193.0" y="123" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><rect x="253.0" y="108" width="105.0" height="22" rx="2" fill="#0c6f71" stroke="#0c6f71" stroke-width="1.5"/><text x="305.5" y="123" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="368.0" y="123" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="start">FP32 range in 16 bits</text><text x="108" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#16181f" text-anchor="end">FP16</text><rect x="118" y="138" width="15.0" height="22" rx="2" fill="#61636d" stroke="#61636d" stroke-width="1.5"/><rect x="133.0" y="138" width="75.0" height="22" rx="2" fill="#1877f2" stroke="#1877f2" stroke-width="1.5"/><text x="170.5" y="153" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><rect x="208.0" y="138" width="150.0" height="22" rx="2" fill="#0c6f71" stroke="#0c6f71" stroke-width="1.5"/><text x="283.0" y="153" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">10</text><text x="368.0" y="153" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#61636d" text-anchor="start">more precision, less range</text><text x="108" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#16181f" text-anchor="end">FP8_e5m2</text><rect x="118" y="168" width="15.0" height="22" rx="2" fill="#61636d" stroke="#61636d" stroke-width="1.5"/><rect x="133.0" y="168" width="75.0" height="22" rx="2" fill="#1877f2" stroke="#1877f2" stroke-width="1.5"/><text x="170.5" y="183" font-family="Archivo, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="7